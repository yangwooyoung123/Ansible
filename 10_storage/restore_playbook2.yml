---
- name: RHEL 시스템 역할을 사용한 스토리지 작업
  hosts: servers
  tasks:
    - name: 선수조건1 - 디스크 존재 유무 확인
      ansible.builtin.debug:
        msg: '[ FAIL ] /dev/nvme0n2 디스크가 존재하지 않습니다!'
      failed_when: ansible_facts['devices']['nvme0n2'] is not defined
    
        
    - name: 스토리지 작업
      ansible.builtin.include_role:
        name: redhat.rhel_system_roles.storage
      vars:
        storage_pools:
          - name: webvg
            type: lvm
            disks:
              - /dev/nvme0n2p1
            volumes:
              - name: weblv
                size: "400MiB"
                mount_point: "/var/www"
                fs_type: ext4
                state: absent
              - name: loglv
                size: "400MiB"
                mount_point: "/var/log/httpd"
                fs_type: xfs
                state: absent

    - name: 파티션 삭제
      community.general.parted:
        device: /dev/nvme0n2
        number: 1
        state: absent