---

- name: play01 - 작업 준비(facts 준비)
  ansible.builtin.import_playbook: setup_facts.yml


###########################################
    # 1) 서비스 패키지 설치 - mariadb-server, httpd
    # 2) 서비스 기동 - mariadb, httpd
    # 3) 방화벽 패키지 설치
    # 4) 방화벽 서비스 기동
    # 5) 방화벽 포트 등록
    # 6) 웹페이지 생성 - /var/www/html/index.html
###########################################
- name: play02 - 여러가지 변수 테스트
  hosts: lamp
  vars_files:
    - vars/main.yml
  tasks:
    - name: 1) 서비스 패키지 설치 및 기동 - mariadb-server, httpd
      ansible.builtin.include_tasks: tasks/main.yml

    - name: 2) 방화벽 패키지 설치
      ansible.builtin.dnf:
        name: firewalld
        state: present
    
    - name: 3) 방화벽 서비스 기동
      ansible.builtin.systemd_service:
        name: firewalld
        state: started
        enabled: true
    
    - name: 4) 방화벽 포트 기동
      ansible.posix.firewalld:
        service: "{{ fw_port }}"
        state: "{{ fw_state }}"
        permanent: true
        immediate: true
    
    - name: 5) 웹 페이지 생성 - /var/www/html/index.html
      ansible.builtin.copy:
        content: |
          <pre>
            Hostname: {{ ansible_facts["fqdn"] }}
            IP: {{ ansible_facts["default_ipv4"]["address"] }}
          </pre>
        dest: "{{ web_root }}/index.html"
        mode: '0644'




