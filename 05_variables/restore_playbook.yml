---

##############################
# Play 01 - 웹 서버 설정
#   1) 웹 패키지 설치 - httpd, mod_ssl, firewalld
#   2) 웹 서비스 설정 - /var/www/html/index.html
#   3) 웹 서비스 기동 - httpd, firewalld
#   4) 방화벽 등록 - http, https
# Play 02 - 웹 요청
#   1) 웹 요청(웹 테스트) - http://192.168.10.11
##############################

- name: Restore playbook.yml
  hosts: webservers
  vars_files:
    - vars/vars.yml
  tasks:
    - name: 1) 방화벽 서비스 제거
      ansible.posix.firewalld:
        service: "{{ item }}"
        state: disabled
        permanent: true
        immediate: true
      loop:
        - "{{ fw_80 }}"
        - "{{ fw_8080 }}"
    
    - name: 3) 웹 서비스 중지
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - "{{ svc_web }}"
        - "{{ svc_fw }}"
    
    - name: 2) 웹 서비스 설정 - "{{ inx_dest }}"
      ansible.builtin.file:
        path: "{{ inx_dest }}"
        state: absent
      
    - name: 1) 웹 패키지 삭제 - "{{ pkg_fw }}"는 제외
      ansible.builtin.dnf:
        name:
          - "{{ pkg_http }}"
          - "{{ pkg_https }}"
        state: absent
    

    

    

