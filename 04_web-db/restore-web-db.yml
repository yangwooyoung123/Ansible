---

- name: 1. WEB-PHP-DB 삭제
  hosts: webservers
  tasks:
    #############################
    # 1) 방화벽 포트 제거
    # 2) 서비스 종료
    # 3) 서비스 설정 삭제
    # 4) 패키지 삭제
    #############################
    - name: 1) 방화벽 포트 해제 - http, https, mysql
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: true
        immediate: true
        state: disabled
      loop:
        - http
        - https
        - mysql
      
    - name: 2) 서비스 종료
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: disabled
        state: stopped
      loop:
        - mariadb
        - httpd
      
    - name: 3) 서비스 설정 삭제
      ansible.builtin.file:
        path: /var/www/html/index.php.txt
        state: absent

    - name: 1) 패키지 삭제- dnf(httpd, mod_ssl, php, php-mysqlnd, php-pdo, firewalld)
      ansible.builtin.dnf:
        name:
          - httpd
          - mod_ssl
          - php
          - php-mysqlnd
          - php-pdo
          # - firewalld
          - mariadb-server
          - mariadb
          - python3-PyMySQL
        state: absent
    


    






