---
#############################
# play01 - DB 서비스 기동
# 1) 패키지 설치
# 2) 서비스 기동
#############################

- name: play01 - DB 서비스 기동
  # hosts: database_dev
  hosts: database_prod
  gather_facts: true
  vars:
    db_pkgs:
      - mariadb
      - mariadb-server
      - python3-PyMySQL
    db_svc: mariadb
  tasks:
    - name: 1) 패키지 설치 - mariadb, mariadb-server, python3-PyMySQA
      ansible.builtin.dnf:
        name: "{{ item }}"
        state: present
      loop: "{{ db_pkgs }}"
      # when: ansible_facts['distribution'] == "CentOS"
      when: ansible_facts['distribution'] == "RedHat"
    
    - name: 2) 서비스 기동 - mariadb
      ansible.builtin.systemd_service:
        name: "{{ db_svc }}"
        state: started
        enabled: true