---
#############################
# play01 - DB 서비스 기동
# 1) 패키지 설치
# 2) 서비스 기동
#############################

- name: play01 - DB 서비스 기동
  # hosts: database_dev
  # hosts: database_prod
  hosts: all
  gather_facts: true
  vars:
    db_pkgs:
      - mariadb
      - mariadb-server
      - python3-PyMySQL
    db_svc: mariadb
  tasks:
    - name: 1) 서비스 중지 - mariadb
      ansible.builtin.systemd_service:
        name: "{{ db_svc }}"
        state: stopped
        enabled: false

    - name: 2) 패키지 삭제 - mariadb, mariadb-server, python3-PyMySQL
      ansible.builtin.dnf:
        name: "{{ item }}"
        state: absent
      loop: "{{ db_pkgs }}"
      when: ansible_facts['distribution'] == "CentOS"
      # when: ansible_facts['distribution'] == "RedHat"
    